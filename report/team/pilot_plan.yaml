    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn trực tiếp 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout tiếp theo"
