# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75)).
#   b) Theo nhân viên, m = 75: DE = 1 + (75-1)*0,02 = 2,48; n = 1.251 * 2,48 = 3.103 yêu cầu/nhóm -> cần 42 nhân viên/nhóm (tổng 84 người > 40 người của LogiX-VN: Không đủ người).
#   c) 20 nhân viên mỗi nhóm: Cỡ mẫu hiệu dụng tối đa n_eff < c / ICC = 20 / 0,02 = 1.000 < 1.251 (Không đạt mức chênh 5 điểm).
#   d) 6 depot mỗi nhóm: Cỡ mẫu hiệu dụng tối đa n_eff < 6 / 0,02 = 300 yêu cầu.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m-1)*0,02) >= 859 -> m >= 299 yêu cầu/nhân viên (DE = 6,96, tổng 5.980 yêu cầu/nhóm).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng làm việc song song cùng thời gian, cùng ca tại 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng thuật toán phân tầng (stratified) theo depot với seed ghi trước.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ chia sẻ gợi ý trong cùng depot; giảm thiểu bằng phân quyền theo staff_id và ghi log mở gợi ý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã xác định trước chỉ số chính, ngưỡng MDE 6 điểm, 3 luật dừng và ngày chốt quyết định 2027-01-05.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm (20 nhân viên) ở mỗi nhóm đối chứng và can thiệp.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận nới mức chênh phát hiện tối thiểu (MDE) từ 5 điểm lên 6 điểm (n = 859 yêu cầu/nhóm). Nếu tác động thật của trợ lý chỉ là 5 điểm, Statistical Power sẽ giảm từ 80% xuống 64,2%.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Tỉ lệ hiện tại toàn mẫu là 4,25% (trong phạm vi noi_dia + hang_nang là 3,97%). Chọn ngưỡng dừng khi nhóm can thiệp cao hơn đối chứng >= 2 điểm phần trăm kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (chi phí 0,22× và 0,69× so với 12.000 đ, simulated); loại bỏ quoc_te (1,88×) và doi_tac (0,85×)"
  assignment:
    unit: "staff"
