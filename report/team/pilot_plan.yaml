    - "NẾU tỉ lệ nhân viên bỏ qua hoặc sửa gợi ý (sua + bo) vượt quá 40% TRONG 1 tuần liên tục THÌ Trưởng nhóm CSKH phỏng vấn trực tiếp 5 nhân viên trong 3 ngày để tìm nguyên nhân KHÔNG THÌ dừng bước rollout ở mức hiện tại"
