# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75))
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = 1.251 * 2,48 = 3.103 yêu cầu mỗi nhóm -> cần 42 nhân viên mỗi nhóm, tổng 84 người > 40 người hiện có: không đủ người
#   c) 20 nhân viên mỗi nhóm: Giới hạn n_eff = c / ICC = 20 / 0,02 = tối đa 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: Giới hạn n_eff = c / ICC = 6 / 0,02 = tối đa 300
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: Giải 20m / (1 + (m - 1) * 0,02) >= 859 -> m >= 299 yêu cầu mỗi người (DE = 6,96, tổng n = 5.980 yêu cầu mỗi nhóm)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên can thiệp.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng ngẫu nhiên theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ kinh nghiệm xử lý trong cùng depot; giảm bằng phân quyền tài khoản theo staff_id và ghi log truy cập.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính (đóng trong 24h & không mở lại 7 ngày), MDE 0,06, ngưỡng luật dừng và ngày quyết định chốt trước khi chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm nhân viên mỗi nhóm (20 control vs 20 treatment).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận tăng MDE lên 6 điểm (thay vì 5 điểm) để khả thi với 20 nhân viên mỗi nhóm; nếu tác động thực tế chỉ là 5 điểm thì Statistical Power suy giảm còn 64,2% (0,64).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại là 4,25% (trong phạm vi noi_dia + hang_nang là 3,97%); ngưỡng an toàn chọn so với đối chứng (chênh +2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ [simulated]); loại bỏ quoc_te (1,88×) và doi_tac (0,85×)"
  assignment:
